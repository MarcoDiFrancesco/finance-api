services:
  finance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finance-api
    ports:
      - 54246:54246
    volumes:
      - ./db/:/app/db/
      - ./router/:/app/router/:ro
      - ./utils/:/app/utils/:ro
      - ./app.py:/app/app.py:ro
    restart: unless-stopped
    user: 1000:1000
  