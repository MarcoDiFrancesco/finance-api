<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cashew Accounting Upload</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 540px; margin: 3rem auto; padding: 0 1rem; color: #111827; }
    h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
    p.sub { color: #4b5563; margin-top: 0; font-size: 0.95rem; }
    form { border: 1px solid #d1d5db; border-radius: 10px; padding: 1.25rem; background: #f9fafb; display: grid; gap: 0.9rem; }
    label { font-weight: 600; font-size: 0.9rem; display: grid; gap: 0.35rem; }
    input[type="file"], input[type="password"] { padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
    button { padding: 0.65rem 1rem; border: 0; border-radius: 6px; background: #059669; color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    pre { background: #111827; color: #e5e7eb; padding: 0.9rem; border-radius: 8px; overflow-x: auto; font-size: 0.85rem; display: none; }
    .err { background: #7f1d1d; color: #fee2e2; }
  </style>
</head>
<body>
  <h1>Cashew Accounting Import</h1>
  <p class="sub">Upload a Cashew <code>.sql</code> backup to enrich with daily CHF FX rates and update Grafana.</p>
  <form id="uploadForm">
    <label>
      Cashew SQLite Export (.sql)
      <input type="file" name="file" accept=".sql,.db,.sqlite,.sqlite3" required />
    </label>
    <label>
      Upload Token
      <input type="password" name="token" required />
    </label>
    <button type="submit" id="submitBtn">Upload &amp; Process</button>
  </form>
  <pre id="output"></pre>
  <script>
    const form = document.getElementById("uploadForm");
    const btn = document.getElementById("submitBtn");
    const out = document.getElementById("output");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      out.style.display = "block";
      out.className = "";
      out.textContent = "Processing SQLite export & fetching FX rates...";
      try {
        const uploadUrl = window.location.pathname.replace(/\/+$/, "") + "/upload";
        const res = await fetch(uploadUrl, { method: "POST", body: new FormData(form) });
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
        if (!res.ok) out.className = "err";
      } catch (err) {
        out.className = "err";
        out.textContent = String(err);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
